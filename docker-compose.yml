services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reviewengine
      POSTGRES_PASSWORD: reviewengine
      POSTGRES_DB: reviewengine
    ports:
      - "5433:5432"
    volumes:
      - reviewengine_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - reviewengine_redis_data:/data

volumes:
  reviewengine_postgres_data:
  reviewengine_redis_data:
